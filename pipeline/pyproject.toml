[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Offline ETL of the diet corpus (E0/E1 normalisation, E2 load and embedding, rotation analysis) and the data tools (anonymisation, PII audits). Runs with the backend virtualenv: no dependencies of its own."
requires-python = "==3.13.*"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
