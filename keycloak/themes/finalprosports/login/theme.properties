# Login theme of the application (v2). Inherits every template from keycloak.v2 and only replaces the
# skin: the palette, the typography and the logo are the ones of docs/architecture/frontend_architecture.md,
# so the identity provider does not look like a different product bolted onto the side.
#
# Only the skin is overridden -- CSS and static resources. No template is copied: a forked .ftl would have to
# be re-checked against every Keycloak upgrade, and the sign-in page is the one screen where a silent breakage
# locks everyone out. resources/img/favicon.ico is the application's own icon (a copy of frontend/public/
# favicon.ico): the parent template already emits <link rel="icon" href="${url.resourcesPath}/img/favicon.ico">
# and resources resolve down the theme chain, so putting the file here is enough -- no template fork for a tab icon.
parent=keycloak.v2
import=common/keycloak

styles=css/login.css
