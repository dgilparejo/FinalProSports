# nginx del contenedor `web`: sirve el SPA y hace de proxy hacia la API en el MISMO origen.
#
# Que el origen sea el mismo no es una comodidad de despliegue, es una decisión de seguridad: con el SPA en
# localhost:4200 y la API en localhost:8000 el navegador ve dos orígenes, hay que abrir CORS y el token viaja
# entre orígenes distintos. Sirviendo los dos por aquí, `apiBaseUrl` es `/api/v1` (relativo), no hay preflight,
# y `CORS_ORIGINS` del backend deja de estar en el camino crítico — sigue configurado para el `ng serve` del
# desarrollo, que sí es otro origen.

upstream fps_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El .odt son ~40 KB y la importación de una analítica viaja como TEXTO dentro del JSON (hasta 200.000
    # caracteres, por contrato del DTO). 1 MB por defecto se queda corto con un informe grande en UTF-8.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------------------------------------- la API
    # Sin barra final en `proxy_pass`: así nginx pasa el URI original TAL CUAL y `/api/v1/clients` llega como
    # `/api/v1/clients`. Con barra, nginx reescribiría la ruta y la API respondería 404 a todo.
    location /api/ {
        proxy_pass http://fps_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La PRIMERA propuesta de un contenedor recién levantado puede cargar el modelo e5 (descarga o lectura del
        # volumen hf_models). 60 s por defecto la cortarían por la mitad y el usuario vería un 504 que no es suyo.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # El PDF y el .odt se bajan por HttpClient como blob: nada de buffering intermedio que retenga la respuesta.
        proxy_buffering off;
    }

    # Swagger, al que enlaza la barra de navegación. `/openapi.json` va aparte porque es quien lo carga.
    location = /docs        { proxy_pass http://fps_api; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://fps_api; proxy_set_header Host $host; }
    location = /redoc       { proxy_pass http://fps_api; proxy_set_header Host $host; }

    # ------------------------------------------------------------------------------------------------ el estático
    # Los ficheros con hash en el nombre (`outputHashing: all`) son inmutables: un cambio genera otro nombre.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Los de i18n NO llevan hash: si se cachean un año, un cambio de traducción no llega nunca.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html jamás se cachea: es quien nombra los bundles con hash. Cacheado, el navegador pediría los de la
    # versión anterior y la aplicación quedaría rota tras un despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Enrutado del lado del cliente: `/clients/<uuid>` no es un fichero. Cualquier ruta que no exista en disco
    # devuelve index.html y decide el router de Angular. Sin esto, recargar una pantalla profunda da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
