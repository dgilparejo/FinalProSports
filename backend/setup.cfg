# import-linter contracts (decision D8, B.4). Run: `lint-imports` from finalprosports/ (dev extra). Mirrored by
# tests/architecture/test_import_contracts.py, which parses the sources with `ast` and needs no dependency installed.
[importlinter]
root_package = finalprosports
include_external_packages = True

[importlinter:contract:layers]
name = Hexagonal layers: infrastructure -> application -> domain, never backwards
type = layers
layers =
    finalprosports.infrastructure
    finalprosports.application
    finalprosports.domain

[importlinter:contract:domain-is-pure]
name = The domain imports no framework and no outer layer
type = forbidden
source_modules =
    finalprosports.domain
forbidden_modules =
    sqlalchemy
    pydantic
    pydantic_settings
    fastapi
    alembic
    psycopg
    pgvector
    sentence_transformers
    numpy
    torch
    finalprosports.application
    finalprosports.infrastructure

[importlinter:contract:application-has-no-framework]
name = The application layer imports neither frameworks nor infrastructure
type = forbidden
source_modules =
    finalprosports.application
forbidden_modules =
    sqlalchemy
    pydantic
    pydantic_settings
    fastapi
    alembic
    psycopg
    pgvector
    sentence_transformers
    numpy
    torch
    finalprosports.infrastructure

[importlinter:contract:pydantic-only-in-rest-dto]
name = pydantic only under infrastructure.adapter.inbound.rest.dto (and config.settings)
type = forbidden
allow_indirect_imports = True
source_modules =
    finalprosports.domain
    finalprosports.application
    finalprosports.main
    finalprosports.infrastructure.composition_root
    finalprosports.infrastructure.config.persistence
    finalprosports.infrastructure.config.security
    finalprosports.infrastructure.config.logging
    finalprosports.infrastructure.adapter.inbound.eval
    finalprosports.infrastructure.adapter.inbound.rest.router
    finalprosports.infrastructure.adapter.inbound.rest.mapper
    finalprosports.infrastructure.adapter.inbound.rest.exception
    finalprosports.infrastructure.adapter.inbound.rest.service
    finalprosports.infrastructure.adapter.inbound.rest.usecase
    finalprosports.infrastructure.adapter.outbound
forbidden_modules =
    pydantic
    pydantic_settings

[importlinter:contract:sqlalchemy-only-in-persistence]
name = sqlalchemy/pgvector only under infrastructure.adapter.outbound.persistence (and config.persistence)
type = forbidden
allow_indirect_imports = True
source_modules =
    finalprosports.domain
    finalprosports.application
    finalprosports.main
    finalprosports.infrastructure.composition_root
    finalprosports.infrastructure.config.settings
    finalprosports.infrastructure.config.security
    finalprosports.infrastructure.config.logging
    finalprosports.infrastructure.adapter.inbound
    finalprosports.infrastructure.adapter.outbound.embeddings
    finalprosports.infrastructure.adapter.outbound.export
    finalprosports.infrastructure.adapter.outbound.security
forbidden_modules =
    sqlalchemy
    pgvector
