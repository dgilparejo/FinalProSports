# Alembic configuration. DATABASE_URL (environment / .env) overrides sqlalchemy.url in db/migrations/env.py.
[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = %(here)s/src
sqlalchemy.url = postgresql+psycopg://finalprosports:finalprosports@localhost:5432/finalprosports

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
